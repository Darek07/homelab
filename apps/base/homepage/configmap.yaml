apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    background:
      image: https://plus.unsplash.com/premium_photo-1664804191180-a35290a96d6b?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1632
      brightness: 50
      opacity: 25
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Portfolio:
        - Darek07:
            - icon: github-light.png
              href: https://github.com/Darek07
        - Homelab:
            - icon: homelable.png
              href: https://github.com/Darek07/homelab
        - ACA:
            - icon: azure-bicep.png
              href: https://github.com/Darek07/azure-container-apps
              description: Azure Container Apps by Bicep
    - Appearance:
        - Substack:
            - icon: si-substack-#FF6719
              href: https://substack.com/@darek07
  services.yaml: |
    - Management:
        - Actual Budget:
            href: https://actualbudget.kaermorhenlab.org
            description: Finance manager
            icon: actual-budget.png
        - Linkding:
            href: https://linkding.kaermorhenlab.org
            description: Bookmarks manager
            icon: linkding.png

    - Entertainment:
        - Jellyfin:
            href: https://jellyfin.kaermorhenlab.org
            description: Media server
            icon: jellyfin.png
        - Seerr:
            href: https://seerr.kaermorhenlab.org
            description: Media discovery
            icon: seerr.png
        - Radarr:
            href: http://radarr.local
            description: Movie collection manager
            icon: radarr.png
        - Sonarr:
            href: http://sonarr.local
            description: Series collection manager
            icon: sonarr.png
        - Bazarr:
            href: http://bazarr.local
            description: Subtitles manager
            icon: bazarr.png
        - Sabnzbd:
            href: http://sabnzbd.local
            description: Binary newsreader for Usenet
            icon: sabnzbd.png

    - Tools:
        - Grafana:
            href: http://grafana.local
            description: Monitoring
            icon: grafana.png

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
        disk: /
    - search:
        provider: google
        showSearchSuggestions: true
        target: _blank
  docker.yaml: ""
  proxmox.yaml: ""
