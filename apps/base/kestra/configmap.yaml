apiVersion: v1
kind: ConfigMap
metadata:
  name: kestra-config
  namespace: kestra
data:
  # Loaded via KESTRA_CONFIGURATION. ${...} placeholders are resolved from env vars.
  application.yaml: |
    datasources:
      postgres:
        url: jdbc:postgresql://kestra-postgres:5432/kestra
        driverClassName: org.postgresql.Driver
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
    kestra:
      url: http://kestra.local/
      repository:
        type: postgres
      queue:
        type: postgres
      storage:
        type: local
        local:
          base-path: /app/storage
      tasks:
        tmp-dir:
          path: /tmp/kestra-wd/tmp
      plugins:
        defaults:
          # No Docker socket on k3s, so script tasks run as local processes.
          - type: io.kestra.plugin.scripts
            values:
              taskRunner:
                type: io.kestra.plugin.core.runner.Process
