apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kestra
  namespace: kestra
spec:
  ingressClassName: traefik
  rules:
    - host: kestra.local
      http:
        paths:
          - backend:
              service:
                name: kestra
                port:
                  number: 80
            path: /
            pathType: Prefix
