apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kestra-postgres
  namespace: kestra
spec:
  selector:
    matchLabels:
      app: kestra-postgres
  serviceName: kestra-postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: kestra-postgres
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 70  # postgres group ID (alpine)
        runAsUser: 70  # postgres user ID (alpine)
        runAsGroup: 70
      containers:
        - name: postgres
          image: postgres:18.7-alpine
          env:
            - name: POSTGRES_DB
              value: kestra
          envFrom:
            - secretRef:
                name: kestra-postgres
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -d kestra -U \"$POSTGRES_USER\""]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            # postgres 18+ keeps PGDATA in a versioned sub-directory of this path.
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 5Gi
