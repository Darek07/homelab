apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: radarr
  name: radarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  strategy: {}
  template:
    metadata:
      labels:
        app: radarr
    spec:
      securityContext:
        fsGroup: 2000
        runAsUser: 2001
        runAsGroup: 2000
      containers:
        - image: lscr.io/linuxserver/radarr:6.3.0.10514-ls313
          name: radarr
          ports:
            - containerPort: 7878
          resources: {}
          envFrom:
            - configMapRef:
                name: media-permissions
          env:
            - name: PUID
              value: "2001"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: data
          persistentVolumeClaim:
            claimName: media-data
