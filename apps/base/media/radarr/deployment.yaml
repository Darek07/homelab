apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: radarr
  name: radarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  strategy: {}
  template:
    metadata:
      labels:
        app: radarr
    spec:
      securityContext:
        fsGroup: 2000
        runAsUser: 2001
        runAsGroup: 2000
      initContainers:
        - image: busybox:1.38.0
          name: permissions
          command: ["sh", "-c", "chown 2001:2000 /run"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: run
              mountPath: /run
      containers:
        - image: lscr.io/linuxserver/radarr:6.3.0.10514-ls313
          name: radarr
          ports:
            - containerPort: 7878
          resources: {}
          envFrom:
            - configMapRef:
                name: media-permissions
          env:
            - name: PUID
              value: "2001"
          volumeMounts:
            - name: run
              mountPath: /run
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 500Mi
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: data
          persistentVolumeClaim:
            claimName: media-data
