apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sabnzbd
  name: sabnzbd
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sabnzbd
  strategy: {}
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      securityContext:
        fsGroup: 2000
        runAsUser: 2002
        runAsGroup: 2000
      initContainers:
        - image: busybox:1.38.0
          name: permissions
          command: ["sh", "-c", "chown 2002:2000 /run"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: run
              mountPath: /run
      containers:
        - image: lscr.io/linuxserver/sabnzbd:5.1.1-ls267
          name: sabnzbd
          ports:
            - containerPort: 8080
          resources: {}
          envFrom:
            - configMapRef:
                name: media-permissions
          env:
            - name: PUID
              value: "2002"
          volumeMounts:
            - name: run
              mountPath: /run
            - name: config
              mountPath: /config
            - name: usenet
              mountPath: /data/usenet
              subPath: usenet
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 500Mi
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: usenet
          persistentVolumeClaim:
            claimName: media-data
