apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: sabnzbd
  name: sabnzbd
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sabnzbd
  strategy: {}
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      securityContext:
        fsGroup: 2000
        runAsUser: 2002
        runAsGroup: 2000
      containers:
        - image: lscr.io/linuxserver/sabnzbd:5.1.0-ls267
          name: sabnzbd
          ports:
            - containerPort: 8080
          resources: {}
          envFrom:
            - configMapRef:
                name: media-permissions
          env:
            - name: PUID
              value: "2002"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: usenet
              mountPath: /usenet
              subpath: usenet
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: usenet
          persistentVolumeClaim:
            claimName: media-data
